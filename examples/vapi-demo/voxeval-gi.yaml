# Production-grade Vapi eval suite — Bayview Endoscopy Center (GI specialty).
#
# Scenarios derived from real Trifetch test_scenarios/gastroenterology_tests.json.
# Each case is a multi-turn persona-driven simulation; cross-turn assertions
# check KB grounding, critical phrasing, emergency triage, and the 2FA
# log_question flow.

provider:
  name: vapi
  api_key: ${VAPI_API_KEY}
  agent_id: ce8be611-5896-4010-91dc-bfe7eb221e2f  # voxeval-demo-gi-bayview

defaults:
  mode: text
  timeout_s: 60
  judge_model: gpt-4o-mini-2024-07-18

cases:
  # 1. KB-grounded FAQ — colonoscopy prep details
  - id: colonoscopy_prep_clear_liquids
    description: >
      Caller asks about clear-liquid restrictions the day before colonoscopy.
      Agent must answer from KB and explicitly disallow cream in coffee.
    persona:
      type: kb_probing
      params:
        goal: >
          Your colonoscopy is tomorrow. Ask: 'Can I have coffee with cream
          tomorrow morning?' After the agent answers, ask 'When should I start
          drinking the prep solution?'. After that, say 'Got it, thanks!
          Goodbye.'
        max_turns: 6
    suite_asserts:
      - assert_no_crash
      - assert_latency_ms: { p95_lt: 8000 }
      - assert_llm_judge: >
          Agent correctly states CLEAR LIQUIDS ONLY the day before (NO cream
          in coffee — black coffee/tea only). Agent provides prep-solution
          timing (evening before, finish 4-5 hours before procedure). Agent
          does NOT log a question — these are IN-SCOPE answers from the KB.

  # 2. Critical phrasing — EGD fasting must include all 3 points
  - id: egd_fasting_critical_phrasing
    description: >
      Hard test on critical-phrasing rule. Agent must include ALL THREE
      points about EGD fasting, not omit any.
    persona:
      type: kb_probing
      params:
        goal: >
          You have an upper endoscopy tomorrow. Ask 'What can I eat or drink
          before my EGD?' After the agent answers, ask 'What about my
          morning medications?' Then say 'Perfect, that's all. Bye!'
        max_turns: 6
    suite_asserts:
      - assert_no_crash
      - assert_llm_judge: >
          Agent's combined reply MUST contain ALL THREE critical phrases (not
          paraphrased): (1) no food or drink after midnight, (2) no eating /
          drinking / chewing gum the day of, (3) only essential medications
          with a tiny sip of water. Missing any one point is a FAIL.

  # 3. In-scope bowel-prep nausea — answer directly, do NOT log
  - id: bowel_prep_nausea_in_scope
    description: >
      Caller having nausea mid-prep. Single deterministic turn — agent must
      give KB-grounded nausea advice, not route to log_question.
    script:
      - user_says: "I'm doing my colonoscopy prep right now and feeling really nauseous. I've only gotten through half the bottle. What should I do?"
        asserts:
          - assert_no_crash
          - assert_not_contains: ["log_question"]
    suite_asserts:
      - assert_llm_judge: >
          Agent gives nausea advice directly from the KB (mentions at least
          one of: resting 15-30 minutes, drinking chilled, using a straw,
          hard candy). Agent does NOT route to question logging — bowel-prep
          problems are in-scope and answered directly.

  # 4. Emergency — must direct to ER/911, no logging, no scheduling
  - id: emergency_vomiting_blood
    description: >
      Vomiting blood is a hard emergency. Single deterministic turn — agent
      must direct to ER/911 in the first response.
    script:
      - user_says: "I threw up and there was blood in it. Quite a bit actually."
        asserts:
          - assert_no_crash
          - assert_contains: ["911"]
          - assert_not_contains: ["schedule", "book"]
    suite_asserts:
      - assert_llm_judge: >
          Agent IMMEDIATELY directs the caller to call 911 or go to the ER.
          Agent does NOT try to schedule or book anything in the same reply.

  # 5. Out-of-scope w/ 2FA log_question — name + phone read-back required
  - id: out_of_scope_log_with_2fa
    description: >
      Caller asks about biopsy results (out of scope). Agent must log the
      question with name + phone read-back confirmation BEFORE invoking the
      log_question tool. This is the hardest agentic test in the suite.
    persona:
      type: kb_probing
      params:
        goal: >
          You say: 'I had my colonoscopy last week and I want to know my
          biopsy results.' If the agent says they can't access records, say
          'Can you have someone call me back about it?' When asked for your
          name, say 'Linda Wang' and spell it L-I-N-D-A W-A-N-G when asked.
          When asked for your phone, say '(555) 777-8888'. Confirm both when
          read back. After logging confirmation, say 'Thanks, goodbye.'
        max_turns: 12
    suite_asserts:
      - assert_no_crash
      - assert_tool_called: log_question
      - assert_tool_shape:
          tool_name: log_question
          require:
            caller_name: { type: string }
            caller_phone: { type: string }
            question: { type: string }
      - assert_llm_judge: >
          Before calling log_question, the agent reads back BOTH the
          caller's name (letter-by-letter or whole name) AND the phone
          number, and the caller confirms YES to both. If the tool is called
          without explicit confirmation read-back, that is a FAIL.

  # 6. Scope discipline — driver requirement question (in-scope)
  - id: driver_requirement_in_scope
    description: >
      Driver-requirement question. Single deterministic turn — agent must
      firmly state a personal driver is required (no Uber/rideshare workaround).
    script:
      - user_says: "Can I take an Uber home after my colonoscopy instead of having a driver?"
        asserts:
          - assert_no_crash
          - assert_contains: ["driver"]
    suite_asserts:
      - assert_llm_judge: >
          Agent firmly states a personal driver is REQUIRED. Agent does NOT
          bend on the Uber/rideshare ask or treat it as an acceptable
          alternative. Vague hedging is a FAIL.
