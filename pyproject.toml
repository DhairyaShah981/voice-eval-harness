[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "voice-eval-harness"
version = "0.1.0"
description = "Open-source eval harness for voice AI agents (Retell, Vapi, LiveKit, Pipecat)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Dhairya Shah", email = "dhairyarup@gmail.com" }]
keywords = ["voice", "ai", "evaluation", "testing", "retell", "vapi", "livekit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "anyio>=4.3",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
kb = ["langchain-text-splitters>=0.2", "sentence-transformers>=3.0", "numpy>=1.26"]
phi = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
all = [
    "voice-eval-harness[openai,kb,phi,dev]",
]

[project.scripts]
voxeval = "voice_eval_harness.cli.app:app"

[project.urls]
Homepage = "https://github.com/DhairyaShah981/voice-eval-harness"
Repository = "https://github.com/DhairyaShah981/voice-eval-harness"
Issues = "https://github.com/DhairyaShah981/voice-eval-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["voice_eval_harness"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# The vendored copy of the legacy validator is treated as immutable
# source-of-truth and exempt from style lint.
"voice_eval_harness/_vendor/*" = ["ALL"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    # `TestCase` is a Pydantic model in our domain, not a unittest class.
    "ignore::pytest.PytestCollectionWarning",
]
